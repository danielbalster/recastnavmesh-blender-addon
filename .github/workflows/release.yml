name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone recastnavigation
        run: |
          git clone --depth 1 --branch main \
            https://github.com/recastnavigation/recastnavigation.git \
            recastnavigation

      - name: Build wrapper
        run: |
          mkdir -p navmesh_addon/libs
          g++ -shared -fPIC -O2 -ffast-math -ffinite-math-only \
            -I recastnavigation/Recast/Include \
            -I recastnavigation/Detour/Include \
            -o navmesh_addon/libs/libNavMeshWrapper.so \
            recastnavigation/Recast/Source/*.cpp \
            recastnavigation/Detour/Source/*.cpp \
            navmesh_wrapper/wrapper.cpp

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: lib-linux
          path: navmesh_addon/libs/libNavMeshWrapper.so

  release:
    needs: build-libs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download library artifact
        uses: actions/download-artifact@v4
        with:
          name: lib-linux
          path: navmesh_addon/libs

      - name: Package add-on (includes libNavMeshWrapper.so)
        run: python3 package.py --version ${{ github.ref_name }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: navmesh_addon-*.zip
          generate_release_notes: true
